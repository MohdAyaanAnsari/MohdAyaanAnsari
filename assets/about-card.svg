<svg fill="none" width="100%" height="210" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .card {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 12px;
          padding: 24px;
          box-sizing: border-box;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .title {
          color: #c9d1d9;
          font-size: 15px;
          line-height: 1.6;
          margin: 0 0 16px 0;
        }
        .highlight {
          color: #3fb950;
          font-weight: 600;
        }
        .bold {
          color: #f0f6fc;
          font-weight: 600;
        }
        .body {
          color: #8b949e;
          font-size: 14px;
          line-height: 1.6;
          margin: 0;
        }
      </style>
      <div class="card">
        <p class="title">
          I am <span class="highlight">Ayaan</span>, a Software Developer specializing in building scalable, production-grade web applications with <span class="bold">React</span>, <span class="bold">Node.js</span>, and <span class="bold">TypeScript</span>.
        </p>
        <p class="body">
          Hands-on industry experience developing REST APIs, real-time architectures via Socket.IO, and managing structured data across SQL and NoSQL systems. Experienced in shipping live features to production and integrating AI capabilities into applications, including automated ATS resume scoring engines and real-time conversational agents.
        </p>
      </div>
    </div>
  </foreignObject>
</svg>
